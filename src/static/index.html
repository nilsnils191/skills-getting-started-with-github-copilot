<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
    <script>
      async function loadActivities() {
        const res = await fetch('/activities');
        const activities = await res.json();
        const container = document.getElementById('activities-container');
        container.innerHTML = '';
        for (const [name, info] of Object.entries(activities)) {
          const card = document.createElement('div');
          card.className = 'activity-card';
          card.innerHTML = `
            <h2>${name}</h2>
            <p><strong>Description:</strong> ${info.description}</p>
            <p><strong>Schedule:</strong> ${info.schedule}</p>
            <p><strong>Max Participants:</strong> ${info.max_participants}</p>
            <div class="participants-section">
              <strong>Participants:</strong>
              <ul class="participants-list">
                ${info.participants.map(p => `<li>${p}</li>`).join('')}
              </ul>
            </div>
          `;
          container.appendChild(card);
        }
      }
      loadActivities();
    </script>
    <style>
      .activity-card {
        box-shadow: 0 2px 8px rgba(0,0,0,0.07);
        border-radius: 8px;
        padding: 1.5em;
        margin-bottom: 2em;
        background: #fff;
      }
      .participants-section {
        margin-top: 1em;
        background: #f9f9fc;
        padding: 0.75em 1em;
        border-radius: 6px;
        border-left: 4px solid #4f8cff;
      }
      .participants-section strong {
        display: block;
        margin-bottom: 0.5em;
        color: #4f8cff;
        font-size: 1.05em;
      }
      .participants-list {
        margin: 0;
        padding-left: 1.2em;
        color: #333;
      }
      .participants-list li {
        margin-bottom: 0.2em;
        font-size: 0.97em;
        list-style-type: disc;
      }
    </style>
  </body>
</html>
